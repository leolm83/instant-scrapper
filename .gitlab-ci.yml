stages:
  - build-jar
  - test-jar
  - build-image
  - test
  - deploy
default:
  tags:
    - docker
    - alpine-linux

# image: maven:latest

variables:
  PROJECT_JAVA_VERSION: 21
  PROJECT_NAME: "instant-gaming-scrapper"
  PROJECT_VERSION: 0.0.1-SNAPSHOT
  PROJECT_JAR_NAME: "${PROJECT_NAME}-${PROJECT_VERSION}.jar"
  PROJECT_DOCKER_IMAGE: "${PROJECT_NAME}:${CI_COMMIT_TAG}"
  BUILD_AND_TEST_IMAGE: "maven:3.9.11-eclipse-temurin-$PROJECT_JAVA_VERSION-alpine"
  DOCKER_HOST: "unix:///var/run/docker.sock"
  # MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
  # MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

build_jar_job:
  stage: build-jar
  image: ${BUILD_AND_TEST_IMAGE}
  script:
    - echo "Building the project..."
    - mvn clean install -DskipTests
  artifacts:
    paths:
      - target/*.jar # Save the compiled JAR as an artifact
      - docker/
    expire_in: 10 mins
  rules:
    -  if: '$CI_COMMIT_TAG'
test_job:
  stage: test-jar
  image: ${BUILD_AND_TEST_IMAGE}
  script:
    - echo "Running tests..."
    - mvn test # Run unit and integration tests
  rules:
    -  if: '$CI_COMMIT_TAG'
build-image:
  image: docker:latest
  before_script:
    - docker info
  stage: build-image
  script:
    - docker build --build-arg PROJECT_JAR_NAME=${PROJECT_JAR_NAME} -f ./docker/Dockerfile -t "${PROJECT_DOCKER_IMAGE}" .
    - docker run "${PROJECT_DOCKER_IMAGE}"
  rules:
    -  if: '$CI_COMMIT_TAG'
     
   





test-job2:
  stage: test
  script:
    - echo "This job tests something, but takes more time than test-job1."
    - echo "After the echo commands complete, it runs the sleep command for 20 seconds"
    - echo "which simulates a test that runs 20 seconds longer than test-job1"
    - sleep 20

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production
