stages:
  - build-jar
  - test-jar
  - build-image
  - test
  - deploy


# image: maven:latest

variables:
  PROJECT_NAME: "instant-gaming-scrapper"
  PROJECT_VERSION: $CI_COMMIT_TAG
  PROJECT_JAR_NAME: "${PROJECT_NAME}${PROJECT_VERSION}.jar"
  PROJECT_DOCKER_IMAGE: "${PROJECT_NAME}${PROJECT_VERSION}"
  # MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode"
  # MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

build_jar_job:
  stage: build-jar
  image: maven:3.8-openjdk-17
  script:
    - echo "Building the project..."
    - mvn clean install -DskipTests
  artifacts:
    paths:
      - target/*.jar # Save the compiled JAR as an artifact
      - docker/
    expire_in: 1 week
  rules:
    -  if: '$CI_COMMIT_TAG'
test_job:
  stage: test-jar
  image: maven:3.8-openjdk-17
  script:
    - echo "Running tests..."
    - mvn test # Run unit and integration tests
  rules:
    -  if: '$CI_COMMIT_TAG'
build-image:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker info
  stage: build-image
  script:
    - docker build -f ./docker/Dockerfile -t "${PROJECT_DOCKER_IMAGE}" .
    - docker run "${PROJECT_DOCKER_IMAGE}"
  rules:
    -  if: '$CI_COMMIT_TAG'





test-job2:
  stage: test
  script:
    - echo "This job tests something, but takes more time than test-job1."
    - echo "After the echo commands complete, it runs the sleep command for 20 seconds"
    - echo "which simulates a test that runs 20 seconds longer than test-job1"
    - sleep 20

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production
